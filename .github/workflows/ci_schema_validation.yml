# EvaluationLog schema validation workflow.
# Builds the devcontainer image, runs complyctl get/generate/scan for all
# configured test providers inside the container, then validates each
# EvaluationLog output with cue vet against the Gemara CUE schema.
name: EvaluationLog Schema Validation

on:
    push:
        branches:
            - main
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    schema-validation:
        name: Validate EvaluationLog Schema
        runs-on: ubuntu-latest

        steps:
            - name: Checkout complyctl
              uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
              with:
                  persist-credentials: false

            - name: Build devcontainer image
              run: |
                  docker build \
                      -t complyctl-devcontainer:ci \
                      -f .devcontainer/Containerfile \
                      .devcontainer/

            - name: Run pipeline in devcontainer
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  docker run --rm \
                      --user root \
                      -e GITHUB_TOKEN="${GITHUB_TOKEN}" \
                      -v "${GITHUB_WORKSPACE}:/workspace:rw" \
                      -w /workspace \
                      complyctl-devcontainer:ci \
                      bash tests/schema-validation/run-pipeline.sh

            - name: Set up Go
              uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
              with:
                  go-version-file: './go.mod'

            - name: Install CUE
              run: |
                  go install cuelang.org/go/cmd/cue@latest

            - name: Fetch CUE module dependencies
              working-directory: tests/schema-validation
              run: |
                  cue mod tidy

            - name: Validate EvaluationLog schema
              run: |
                  ./tests/schema-validation/validate.sh "${GITHUB_WORKSPACE}/.ci-scan-output"
